name: Runtime CI Integration

on:
  push:
    paths:
      - 'auto_agent/**'
  workflow_dispatch:

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Run Runtime Integration Tests
        run: |
          python -m auto_agent.runtime.production_runtime_test
