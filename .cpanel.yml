deployment:
  tasks:
    - export APPDIR=/home/zomorodm/zomorodmelal-app/django_project
    - export WEBROOT=/home/zomorodm/public_html
    - /bin/cp -R django_project/. $APPDIR/
    - /bin/mkdir -p $APPDIR/autonomous_core
    - /bin/cp -R autonomous_core/. $APPDIR/autonomous_core/
    - /bin/mkdir -p $APPDIR/tmp
    - /bin/touch $APPDIR/tmp/restart.txt
    - /bin/cp -f deploy/public_html/.htaccess $WEBROOT/.htaccess
