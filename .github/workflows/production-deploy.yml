name: Master Agent Production Gate

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: "Verified ChangePackage ID"
        required: true
        type: string
      request_id:
        description: "Owner approval request ID"
        required: true
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://zomorodmelal.ir/
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Compile and test
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Verify deployment gate
        env:
          PACKAGE_ID: ${{ inputs.package_id }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python - <<'PY'
          import os
          from controller.deployment_gate import DeploymentGate
          gate = DeploymentGate('.')
          status = gate.status()
          if not status['owner_approval_required']:
              raise SystemExit('owner approval boundary is disabled')
          print(status)
          print('package_id=', os.environ['PACKAGE_ID'])
          print('request_id=', os.environ['REQUEST_ID'])
          PY

      - name: Production deployment adapter
        env:
          MASTER_AGENT_DEPLOY_ENABLED: ${{ vars.MASTER_AGENT_DEPLOY_ENABLED }}
        run: |
          if [ "$MASTER_AGENT_DEPLOY_ENABLED" != "true" ]; then
            echo "External host deployment adapter is not configured; stopping safely after approval-gated verification."
            exit 0
          fi
          echo "Deployment adapter is enabled, but no host-specific command is hard-coded in the repository."
          echo "Configure the approved host adapter separately before enabling this flag."
          exit 1
