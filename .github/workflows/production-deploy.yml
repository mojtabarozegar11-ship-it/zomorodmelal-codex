name: Master Agent Production Gate

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: "Verified ChangePackage ID"
        required: true
        type: string
      request_id:
        description: "Owner approval request ID"
        required: true
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://zomorodmelal.ir/
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Compile and test
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Verify deployment gate
        env:
          PACKAGE_ID: ${{ inputs.package_id }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python - <<'PY'
          import os
          from controller.deployment_gate import DeploymentGate
          gate = DeploymentGate('.')
          status = gate.status()
          assert status['owner_approval_required'] is True
          assert status['package_hash_binding'] is True
          print(status)
          print('package_id=', os.environ['PACKAGE_ID'])
          print('request_id=', os.environ['REQUEST_ID'])
          PY
      - name: Execute approved host adapter
        if: ${{ vars.MASTER_AGENT_DEPLOY_ENABLED == 'true' }}
        env:
          MASTER_AGENT_DEPLOY_ENABLED: ${{ vars.MASTER_AGENT_DEPLOY_ENABLED }}
          MASTER_AGENT_DEPLOY_COMMAND: ${{ secrets.MASTER_AGENT_DEPLOY_COMMAND }}
        run: |
          python - <<'PY'
          import os
          from deployment.host_adapter import HostDeploymentAdapter
          result = HostDeploymentAdapter().deploy()
          print(result)
          if not result.success:
              raise SystemExit('approved deployment adapter failed')
          PY
      - name: Safe stop when host adapter is not configured
        if: ${{ vars.MASTER_AGENT_DEPLOY_ENABLED != 'true' }}
        run: echo "Host adapter is disabled; no external deployment was performed."
