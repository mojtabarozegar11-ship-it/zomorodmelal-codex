name: Master Agent Production Gate

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: "Verified ChangePackage ID"
        required: true
        type: string
      request_id:
        description: "Owner approval request ID"
        required: true
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://zomorodmelal.ir/
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Compile and test
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Verify deployment configuration
        env:
          MASTER_AGENT_DEPLOY_ENABLED: ${{ vars.MASTER_AGENT_DEPLOY_ENABLED }}
          MASTER_AGENT_DEPLOY_COMMAND: ${{ secrets.MASTER_AGENT_DEPLOY_COMMAND }}
        run: |
          python - <<'PY'
          import os
          from deployment.host_adapter import HostDeploymentAdapter
          adapter = HostDeploymentAdapter()
          print({"enabled": adapter.enabled, "command_configured": bool(adapter.command)})
          if adapter.enabled and not adapter.command:
              raise SystemExit('deployment is enabled but the host adapter command is missing')
          PY
      - name: Production handoff
        env:
          PACKAGE_ID: ${{ inputs.package_id }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          echo "Production handoff requested for package ${PACKAGE_ID}, approval request ${REQUEST_ID}."
          echo "The application DeploymentGate must verify the persisted owner approval and package hash binding before any external deployment."
          echo "No external deployment is performed by this workflow unless that application-level gate is executed with the approved runtime state."
