name: Master Agent MVP Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r django_project/requirements.txt
          pip install pytest python-multipart fastapi httpx
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/django_project
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_SECRET_KEY: ci-mvp-secret
          DJANGO_DEBUG: "True"
          AUTONOMOUS_CYCLE_INNER_TESTS: "1"
        run: pytest -q tests worker_mojtaba/tests worker_mojtaba/api/test_server.py
