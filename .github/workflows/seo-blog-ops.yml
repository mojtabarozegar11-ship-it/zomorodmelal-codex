name: SEO Blog Operations

on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

jobs:
  seo-blog-ops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: django_project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SEO blog operations job
        working-directory: django_project
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          PYTHONPATH: ${{ github.workspace }}/django_project:${{ github.workspace }}
        run: |
          python manage.py seo_blog_operations
