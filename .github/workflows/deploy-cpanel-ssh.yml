name: Deploy Zomorod Melal to Pars Web Server
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: zomorodmelal-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate production secrets
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          APP_ROOT: ${{ secrets.CPANEL_APP_ROOT }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_PORT"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$APP_ROOT"
      - name: Build cPanel package
        run: |
          set -euo pipefail
          python scripts/verify_cpanel_layout.py
          rm -rf package ZOMORODMEL.IR.zip
          mkdir -p package/zomorodmelal-app
          cp -a django_project/. package/zomorodmelal-app/
          for item in autonomous_core django_integration ai_engine ai_providers agents agent_runtime access memory monitoring orchestrator planner sandbox security self_audit self_improvement site_integration tasks telegram_control testing tools versioning web_research run_master_agent.py ai_bridge.py CPANEL_DEPLOYMENT.md HOST_HANDOFF_CHECKLIST.md HOST_BRIDGE_SETUP.md README.md host_bridge; do
            if [ -e "$item" ]; then cp -a "$item" package/zomorodmelal-app/; fi
          done
          printf '%s\n' 'deployment:' '  tasks:' '    - /bin/mkdir -p /home/zomorodm/zomorodmelal-app/tmp' '    - /bin/touch /home/zomorodm/zomorodmelal-app/tmp/restart.txt' > package/zomorodmelal-app/.cpanel.yml
          find package -type d -name __pycache__ -prune -exec rm -rf {} +
          find package -type f -name '*.pyc' -delete
          cd package
          test -f zomorodmelal-app/passenger_wsgi.py
          test -f zomorodmelal-app/manage.py
          test -f zomorodmelal-app/config/settings.py
          test -f zomorodmelal-app/requirements-host.txt
          zip -qr ../ZOMORODMEL.IR.zip .
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Upload and deploy package
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          APP_ROOT: ${{ secrets.CPANEL_APP_ROOT }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes ZOMORODMEL.IR.zip "$SSH_USER@$SSH_HOST:/tmp/ZOMORODMEL.IR-$GITHUB_SHA.zip"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" bash -s -- "$APP_ROOT" "/tmp/ZOMORODMEL.IR-$GITHUB_SHA.zip" <<'REMOTE'
          set -euo pipefail
          APP_ROOT="$1"
          ZIP_PATH="$2"
          RELEASE_ROOT="${APP_ROOT}.release"
          rm -rf "$RELEASE_ROOT"
          mkdir -p "$RELEASE_ROOT"
          unzip -q "$ZIP_PATH" -d "$RELEASE_ROOT"
          test -f "$RELEASE_ROOT/zomorodmelal-app/passenger_wsgi.py"
          test -f "$RELEASE_ROOT/zomorodmelal-app/manage.py"
          if [ -f "$APP_ROOT/.env" ]; then cp "$APP_ROOT/.env" "$RELEASE_ROOT/zomorodmelal-app/.env"; fi
          if [ -x "$APP_ROOT/.venv/bin/python" ]; then PYTHON="$APP_ROOT/.venv/bin/python"; elif [ -x "$APP_ROOT/venv/bin/python" ]; then PYTHON="$APP_ROOT/venv/bin/python"; else PYTHON=python; fi
          cd "$RELEASE_ROOT/zomorodmelal-app"
          "$PYTHON" -m pip install -r requirements-host.txt
          "$PYTHON" manage.py migrate --noinput
          "$PYTHON" manage.py collectstatic --noinput
          "$PYTHON" manage.py check
          cd /home/zomorodm
          rm -rf "$APP_ROOT.previous"
          if [ -d "$APP_ROOT" ]; then mv "$APP_ROOT" "$APP_ROOT.previous"; fi
          mv "$RELEASE_ROOT/zomorodmelal-app" "$APP_ROOT"
          mkdir -p "$APP_ROOT/tmp"
          touch "$APP_ROOT/tmp/restart.txt"
          rm -f "$ZIP_PATH"
          rm -rf "$APP_ROOT.previous"
          REMOTE
      - name: Public HTTPS smoke test
        run: |
          set -euo pipefail
          code=""
          for i in 1 2 3 4 5; do
            code=$(curl -L -s -o /dev/null -w '%{http_code}' --max-time 20 https://zomorodmelal.ir/ || true)
            case "$code" in
              2*|3*) echo "HTTPS smoke test: $code"; exit 0 ;;
            esac
            sleep 5
          done
          echo "HTTPS smoke test failed: $code"
          exit 1
