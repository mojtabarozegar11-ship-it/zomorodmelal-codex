name: Build cPanel ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create clean cPanel package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package zomorodmelal-cpanel.zip
          mkdir -p package
          cp -a django_project package/django_project
          for item in autonomous_core ai_engine ai_providers agents agent_runtime access api app config core database memory monitoring orchestrator planner research sandbox security self_audit self_improvement site_integration tasks telegram_control testing tools versioning web_research website run_master_agent.py ai_bridge.py requirements.txt .cpanel.yml CPANEL_DEPLOYMENT.md HOST_HANDOFF_CHECKLIST.md README.md; do
            if [ -e "$item" ]; then
              cp -a "$item" package/
            fi
          done
          find package -type d -name __pycache__ -prune -exec rm -rf {} +
          find package -type f -name '*.pyc' -delete
          cd package
          zip -r ../zomorodmelal-cpanel.zip .
          cd ..
          unzip -l zomorodmelal-cpanel.zip | grep -E 'django_project/passenger_wsgi.py|django_project/manage.py|django_project/config/settings.py'
      - name: Upload deployment ZIP
        uses: actions/upload-artifact@v4
        with:
          name: zomorodmelal-cpanel
          path: zomorodmelal-cpanel.zip
          retention-days: 7

  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker_mojtaba/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run Android unit tests
        run: gradle --no-daemon --stacktrace test

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload Worker Mojtaba APK
        uses: actions/upload-artifact@v4
        with:
          name: worker-mojtaba-debug-apk
          path: worker_mojtaba/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
