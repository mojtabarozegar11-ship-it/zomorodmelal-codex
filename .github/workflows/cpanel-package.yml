name: Build cPanel ZIP

on:
  push:
    branches:
      - main
      - integration/zomorodmelal-full-project-20260921
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify cPanel source layout
        run: python scripts/verify_cpanel_layout.py

      - name: Create clean cPanel package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package ZOMORODMEL.IR.zip
          mkdir -p package/zomorodmelal-app
          cp -a django_project/. package/zomorodmelal-app/
          for item in autonomous_core django_integration ai_engine ai_providers agents agent_runtime access memory monitoring orchestrator planner sandbox security self_audit self_improvement site_integration tasks telegram_control testing tools versioning web_research run_master_agent.py ai_bridge.py .cpanel.yml CPANEL_DEPLOYMENT.md HOST_HANDOFF_CHECKLIST.md HOST_BRIDGE_SETUP.md README.md host_bridge; do
            if [ -e "$item" ]; then
              cp -a "$item" package/zomorodmelal-app/
            fi
          done
          mkdir -p package/zomorodmelal-app/tmp
          printf '%s\n' \
            'deployment:' \
            '  tasks:' \
            '    - /bin/mkdir -p /home/zomorodm/zomorodmelal-app/tmp' \
            '    - /bin/touch /home/zomorodm/zomorodmelal-app/tmp/restart.txt' \
            > package/zomorodmelal-app/.cpanel.yml
          find package -type d -name __pycache__ -prune -exec rm -rf {} +
          find package -type f -name '*.pyc' -delete
          cd package
          test -f zomorodmelal-app/passenger_wsgi.py
          test -f zomorodmelal-app/manage.py
          test -f zomorodmelal-app/config/settings.py
          test -f zomorodmelal-app/requirements-host.txt
          zip -r ../ZOMORODMEL.IR.zip .
          cd ..
          unzip -l ZOMORODMEL.IR.zip | grep -E '(^| )zomorodmelal-app/passenger_wsgi.py|(^| )zomorodmelal-app/manage.py|(^| )zomorodmelal-app/config/settings.py|(^| )zomorodmelal-app/requirements-host.txt'

      - name: Upload deployment ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ZOMORODMEL.IR
          path: ZOMORODMEL.IR.zip
          if-no-files-found: error
          retention-days: 7
