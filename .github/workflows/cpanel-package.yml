name: Build cPanel ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify cPanel source layout
        run: python scripts/verify_cpanel_layout.py

      - name: Create clean cPanel package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package ZOMORODMEL.IR.zip
          mkdir -p package/zomorodmelal-app
          # cPanel is already configured with Application Root=zomorodmelal-app.
          # Therefore the Django runtime must be placed directly at that root:
          # passenger_wsgi.py, manage.py, config/, apps/, requirements.txt, etc.
          cp -a django_project/. package/zomorodmelal-app/
          # Add non-conflicting project/runtime modules and deployment helpers.
          for item in autonomous_core ai_engine ai_providers agents agent_runtime access memory monitoring orchestrator planner sandbox security self_audit self_improvement site_integration tasks telegram_control testing tools versioning web_research run_master_agent.py ai_bridge.py .cpanel.yml CPANEL_DEPLOYMENT.md HOST_HANDOFF_CHECKLIST.md HOST_BRIDGE_SETUP.md README.md host_bridge; do
            if [ -e "$item" ]; then
              cp -a "$item" package/zomorodmelal-app/
            fi
          done
          # The installed cPanel application root is /home/zomorodm/zomorodmelal-app.
          # Generate a package-local restart rule for that root.
          printf '%s\n' \
            'deployment:' \
            '  tasks:' \
            '    - /bin/mkdir -p /home/zomorodm/zomorodmelal-app/tmp' \
            '    - /bin/touch /home/zomorodm/zomorodmelal-app/tmp/restart.txt' \
            > package/zomorodmelal-app/.cpanel.yml
          find package -type d -name __pycache__ -prune -exec rm -rf {} +
          find package -type f -name '*.pyc' -delete
          cd package
          test -f zomorodmelal-app/passenger_wsgi.py
          test -f zomorodmelal-app/manage.py
          test -f zomorodmelal-app/config/settings.py
          test -f zomorodmelal-app/requirements-host.txt
          zip -r ../ZOMORODMEL.IR.zip .
          cd ..
          unzip -l ZOMORODMEL.IR.zip | grep -E '(^| )zomorodmelal-app/passenger_wsgi.py|(^| )zomorodmelal-app/manage.py|(^| )zomorodmelal-app/config/settings.py|(^| )zomorodmelal-app/requirements-host.txt'
      - name: Upload deployment ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ZOMORODMEL.IR
          path: ZOMORODMEL.IR.zip
          retention-days: 7

  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker_mojtaba/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT="$HOME/android-sdk"; fi
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            FOUND="$(find "$HOME" /opt -type f -name sdkmanager 2>/dev/null | head -1 || true)"
            if [ -n "$FOUND" ]; then
              SDK_ROOT="$(dirname "$(dirname "$(dirname "$FOUND")")")"
            fi
          fi
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Android SDK command-line tools not found"
            find "$HOME" /opt -maxdepth 7 -type f -name sdkmanager 2>/dev/null | head -20 || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run Android unit tests
        run: gradle --no-daemon --stacktrace test

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload Worker Mojtaba APK
        uses: actions/upload-artifact@v4
        with:
          name: worker-mojtaba-debug-apk
          path: worker_mojtaba/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
