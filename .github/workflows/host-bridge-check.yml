name: Host Bridge Validation

on:
  push:
    branches: [main]
    paths:
      - "host_bridge/**"
      - "HOST_BRIDGE_SETUP.md"
      - "HOST_BRIDGE_CONNECTOR.md"
      - ".github/workflows/host-bridge-check.yml"
  pull_request:
    paths:
      - "host_bridge/**"
      - "HOST_BRIDGE_SETUP.md"
      - "HOST_BRIDGE_CONNECTOR.md"
      - ".github/workflows/host-bridge-check.yml"
  workflow_dispatch:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - name: Lint bridge PHP
        shell: bash
        run: |
          set -euo pipefail
          for f in host_bridge/*.php; do
            php -l "$f"
          done
      - name: Validate shell script syntax
        shell: bash
        run: bash -n host_bridge/report.sh
      - name: Validate OpenAPI file
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          text = pathlib.Path("host_bridge/openapi.yaml").read_text(encoding="utf-8")
          required = [
              "openapi: 3.0.3",
              "POST /files.php",
              "bearerAuth",
              "read_file",
              "write_file",
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit("Missing OpenAPI contract markers: " + ", ".join(missing))
          print("OpenAPI contract markers OK")
          PY
