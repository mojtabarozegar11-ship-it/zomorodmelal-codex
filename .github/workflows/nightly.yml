name: Zomorod 24/7 Nightly

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip<25.1"
          python -m pip install -r requirements.txt
          python -m pip install -r django_project/requirements.txt

      - name: Run project tests
        run: bash scripts/run-tests.sh

      - name: Build cPanel ZIP
        run: bash scripts/build-zip.sh

      - name: Collect logs
        if: always()
        run: bash scripts/collect-logs.sh

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: zomorodmelal-cpanel
          path: dist/zomorodmelal-cpanel.zip
          if-no-files-found: error

      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zomorodmelal-failure-report
          path: logs/failure-report.txt
          if-no-files-found: warn
