name: Worker Mojtaba Android Build

on:
  push:
    paths:
      - "worker_mojtaba/**"
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker_mojtaba/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT="$HOME/android-sdk"; fi
          echo "Using Android SDK: $SDK_ROOT"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "sdkmanager not found in runner SDK"
            find "$HOME" /opt -maxdepth 6 -type f -name sdkmanager 2>/dev/null | head -20 || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: worker-mojtaba-debug-apk
          path: worker_mojtaba/android/app/build/outputs/apk/debug/app-debug.apk
