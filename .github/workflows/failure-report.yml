name: Zomorod Failure Report

on:
  workflow_run:
    workflows:
      - "Zomorod Melal Django CI"
      - "cPanel Production Simulation"
      - "Zomorod 24/7 Nightly"
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  report:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = `CI failure: ${run.name} — ${run.head_sha.slice(0,7)}`;
            const body = [
              "## Automated failure report",
              "",
              `Workflow: **${run.name}**`,
              `Commit: **${run.head_sha}**`,
              `Branch: **${run.head_branch || "unknown"}**`,
              `Run: ${run.html_url}`,
              "",
              "Next step: inspect the failed job logs before making any code change."
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            if (!existing.data.some(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
