name: Django Offline Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r django_project/requirements.txt
      - name: Django check
        working-directory: django_project
        run: python manage.py check
      - name: Django integration tests
        working-directory: django_project
        env:
          PYTHONPATH: '${{ github.workspace }}:${{ github.workspace }}/django_project'
        run: python -m django test api.tests.test_agent_endpoint apps.ai.tests_admin
      - name: Website route tests
        run: |
          python -m pip install -r django_project/requirements.txt
          PYTHONPATH='${{ github.workspace }}:${{ github.workspace }}/django_project' DJANGO_SETTINGS_MODULE=website.config.settings python -m django test website.core
      - name: Host entrypoint imports
        working-directory: django_project
        env:
          PYTHONPATH: '${{ github.workspace }}:${{ github.workspace }}/django_project'
        run: python -c "import config.wsgi, config.asgi; print('Master WSGI/ASGI import OK')"
      - name: Website WSGI import
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: python -c "import website.config.wsgi; print('Website WSGI import OK')"
