name: Django Offline Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip<25.1"
          pip install -r django_project/requirements.txt
      - name: Django check
        working-directory: django_project
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          PYTHONPATH: ${{ github.workspace }}/django_project:${{ github.workspace }}
        run: python manage.py check
      - name: Django migrations check
        working-directory: django_project
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          PYTHONPATH: ${{ github.workspace }}/django_project:${{ github.workspace }}
        run: python manage.py makemigrations --check --dry-run
      - name: Primary Django tests
        working-directory: django_project
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          PYTHONPATH: ${{ github.workspace }}/django_project
        run: python -m django test apps.site apps.encyclopedia apps.economy apps.studio apps.services apps.economy.tests_signals api.tests.test_agent_endpoint apps.ai.tests_admin
      - name: Host entrypoint imports
        working-directory: django_project
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          PYTHONPATH: ${{ github.workspace }}/django_project
        run: python -c "import config.wsgi, config.asgi; print('Primary WSGI/ASGI import OK')"
      - name: Legacy website compatibility check
        working-directory: website
        env:
          DJANGO_SETTINGS_MODULE: website.config.settings
          PYTHONPATH: ${{ github.workspace }}
        run: python -c "import website.config.wsgi; print('Legacy website import OK')"
