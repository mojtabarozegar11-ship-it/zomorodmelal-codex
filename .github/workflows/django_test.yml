name: Django Offline Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r django_project/requirements.txt
      - name: Django check
        working-directory: django_project
        run: python manage.py check
      - name: Django tests
        working-directory: django_project
        env:
          PYTHONPATH: '${{ github.workspace }}:${{ github.workspace }}/django_project'
        run: python -m django test api.tests.test_agent_endpoint apps.ai.tests_admin
      - name: Host entrypoint imports
        working-directory: django_project
        env:
          PYTHONPATH: '${{ github.workspace }}:${{ github.workspace }}/django_project'
        run: python -c "import config.wsgi, config.asgi; print('WSGI/ASGI import OK')"
