name: Django Offline Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip<25.1"
          pip install -r django_project/requirements.txt
          pip install ruff
      - name: Ruff static analysis
        working-directory: django_project
        run: ruff check apps api config manage.py --select E4,E7,E9,F --ignore E501 --exclude '**/migrations/**'

      - name: Django check
        working-directory: django_project
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_SECRET_KEY: "ci-only-secret"
          DJANGO_DEBUG: "False"
          PYTHONPATH: ${{ github.workspace }}/django_project:${{ github.workspace }}
        run: python manage.py check
      - name: Django migrations check
        working-directory: django_project
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_SECRET_KEY: "ci-only-secret"
          DJANGO_DEBUG: "False"
          PYTHONPATH: ${{ github.workspace }}/django_project:${{ github.workspace }}
        run: python manage.py makemigrations --check --dry-run
      - name: URL smoke tests
        working-directory: django_project
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_SECRET_KEY: "ci-only-secret"
          DJANGO_DEBUG: "False"
          PYTHONPATH: ${{ github.workspace }}/django_project:${{ github.workspace }}
        run: |
          python -c "import django; django.setup(); from django.test import Client; c=Client(); paths=['/','/economy/','/economy/services/','/economy/api/v1/services/','/architecture/']; [print(p, c.get(p).status_code) for p in paths]"
      - name: Primary Django tests
        working-directory: django_project
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_SECRET_KEY: "ci-only-secret"
          DJANGO_DEBUG: "False"
          PYTHONPATH: ${{ github.workspace }}/django_project:${{ github.workspace }}
        run: python -m django test

      - name: Host entrypoint imports
        working-directory: django_project
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_SECRET_KEY: "ci-only-secret"
          DJANGO_DEBUG: "False"
          PYTHONPATH: ${{ github.workspace }}/django_project:${{ github.workspace }}
        run: python -c "import config.wsgi, config.asgi; print('Primary WSGI/ASGI import OK')"
      - name: Legacy website compatibility check
        working-directory: website
        env:
          DJANGO_SETTINGS_MODULE: website.config.settings
          PYTHONPATH: ${{ github.workspace }}
        run: python -c "import website.config.wsgi; print('Legacy website import OK')"
