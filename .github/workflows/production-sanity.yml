name: Production Sanity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  django-sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip<25.1"
          pip install -r requirements.txt
          pip install -r django_project/requirements.txt

      - name: Django checks
        working-directory: django_project
        env:
          PYTHONPATH: ${{ github.workspace }}/django_project:${{ github.workspace }}
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_SECRET_KEY: ci-sanity-secret
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: "zomorodmelal.ir,www.zomorodmelal.ir,localhost,127.0.0.1"
        run: |
          python manage.py check
          python manage.py check --deploy

      - name: WSGI import check
        working-directory: django_project
        env:
          PYTHONPATH: ${{ github.workspace }}/django_project:${{ github.workspace }}
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_SECRET_KEY: ci-sanity-secret
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: "zomorodmelal.ir,www.zomorodmelal.ir,localhost,127.0.0.1"
        run: |
          python -c "import config.wsgi; print('WSGI OK')"
          python -c "import passenger_wsgi; print('Passenger WSGI OK')"
