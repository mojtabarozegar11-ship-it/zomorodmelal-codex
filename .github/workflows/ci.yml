name: Zomorod Melal Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  django-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django_project
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q .

      - name: Django check
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: "ci-only-secret"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
          DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost"
        run: python manage.py check

      - name: Django deploy check
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-only-secret"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
          DJANGO_CSRF_TRUSTED_ORIGINS: "https://localhost"
          DJANGO_SECURE_SSL_REDIRECT: "False"
        run: python manage.py check --deploy

      - name: Migration consistency
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: "ci-only-secret"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: "ci-only-secret"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: python manage.py test

  repository-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install root test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install python-dotenv python-telegram-bot
      - name: Compile repository
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
