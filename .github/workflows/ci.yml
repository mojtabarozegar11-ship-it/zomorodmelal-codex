name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: django_project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Django runtime dependencies
        run: python -m pip install -r requirements-host.txt

      - name: Verify cPanel source layout
        working-directory: .
        run: python scripts/verify_cpanel_layout.py

      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-secret-not-for-production
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost
        run: python manage.py check

      - name: Django deploy check
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-secret-not-for-production
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost
        run: python manage.py check --deploy

      - name: Migration consistency
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-secret-not-for-production
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-secret-not-for-production
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py test

      - name: WSGI import
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-secret-not-for-production
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: python -c "import config.wsgi; import passenger_wsgi; print('WSGI_OK')"
