name: Android Master Agent Production

on:
  push:
    branches: [master-agent-production, main]
    paths:
      - "master_agent/**"
      - "autonomous_core/**"
      - "worker_mojtaba/android/**"
      - "tests/test_canonical_master_agent_runtime.py"
      - ".github/workflows/master-agent-production.yml"
  pull_request:
    branches: [master-agent-production, main]
  workflow_dispatch:

concurrency:
  group: android-master-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify canonical runtime
        run: |
          python -m master_agent --check --json
          python -m master_agent --once --goal "Android production smoke test" --json
          python -m pytest -q tests/test_canonical_master_agent_runtime.py
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker_mojtaba/android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          test -d "$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Validate Android project
        env:
          WORKER_API_BASE_URL: ""
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          grep -q 'applicationId = "com.mojtaba.worker"' app/build.gradle.kts
      - name: Unit tests
        run: gradle --no-daemon --stacktrace test
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Build release AAB
        run: gradle --no-daemon --stacktrace bundleRelease
      - name: Verify release artifacts
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worker-mojtaba-release
          path: |
            worker_mojtaba/android/app/build/outputs/apk/debug/app-debug.apk
            worker_mojtaba/android/app/build/outputs/bundle/release/app-release.aab
