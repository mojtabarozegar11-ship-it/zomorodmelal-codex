name: Master Agent Production Validation

on:
  push:
    branches: ["master-agent-production", "main"]
  pull_request:
    branches: ["master-agent-production", "main"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "ci-test-secret"
      DJANGO_DB_PATH: /tmp/zomorodmelal-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r worker_mojtaba/requirements.txt
      - name: Canonical runtime readiness
        run: python -m master_agent --check --json
      - name: Canonical runtime smoke cycle
        run: python -m master_agent --once --goal "CI production runtime smoke test" --json
      - name: Django system checks
        working-directory: django_project
        run: python manage.py check
      - name: Test suite
        run: pytest -q --disable-warnings
