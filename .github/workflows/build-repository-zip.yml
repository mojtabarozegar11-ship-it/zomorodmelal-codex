name: Build Repository ZIP

on:
  push:
    branches:
      - "export/repo-zip-20260918"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create ZIP
        run: |
          mkdir -p dist
          zip -r dist/zomorodmelal-codex.zip . -x ".git/*" "dist/*"
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: zomorodmelal-codex
          path: dist/zomorodmelal-codex.zip
          if-no-files-found: error
