<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نبرد مزارع زمرد</title><style>body{margin:0;background:#102c23;color:#f7f3dc;font-family:Tahoma,sans-serif;text-align:center}header{padding:14px;background:#1e4938}h1{font-size:23px}button{border:0;border-radius:12px;padding:12px;margin:4px;background:#e8bb59;color:#172e24;font-weight:bold;cursor:pointer}button:disabled{opacity:.4}#stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:12px}.map{display:grid;grid-template-columns:repeat(6,minmax(42px,75px));gap:5px;justify-content:center;margin:18px auto;direction:ltr}.tile{height:65px;background:#5b8c4c;border:2px solid #83ac6a;border-radius:9px;font-size:29px}.tile.sel{border-color:#ffdc60;background:#7f9d41}.tile.enemy{background:#a65c4b}#log{max-width:550px;margin:16px auto;min-height:60px;padding:12px;background:#1d4738;border-radius:12px}small{color:#cbd9c9}</style><header><h1>🌾 نبرد امپراتوری مزارع زمرد ⚔️</h1><small>کشاورزی، توسعه و نبرد با رقیب هوشمند</small></header><div id="stats"></div><div id="map" class="map"></div><div><button onclick="act('plant')">🌱 کاشت (۱۰ سکه)</button><button onclick="act('harvest')">🌽 برداشت</button><button onclick="act('tower')">🏰 برج (۴۰ سکه)</button><button onclick="act('train')">🛡️ آموزش نیرو (۳۰ سکه)</button><button onclick="act('attack')">⚔️ حمله (۳ نیرو)</button><button onclick="act('next')">⏭️ روز بعد</button><button onclick="reset()">🔄 شروع مجدد</button></div><div id="log" role="status"></div><script>const key='zomorod-farm-wars-v1';const fresh=()=>({day:1,coins:100,food:20,army:2,hp:100,enemy:100,selected:0,plots:Array(36).fill('empty'),growth:Array(36).fill(0),msg:'یک خانه را انتخاب کنید؛ بکارید و برای نبرد آماده شوید.'});let s;try{s=JSON.parse(localStorage.getItem(key))||fresh();if(!Array.isArray(s.plots)||s.plots.length!==36)throw 0}catch{s=fresh()}function save(){localStorage.setItem(key,JSON.stringify(s))}function render(){document.getElementById('stats').textContent='📅 روز '+s.day+' | 🪙 '+s.coins+' | 🌽 '+s.food+' | 🛡️ '+s.army+' | ❤️ '+s.hp+' | 🏴 رقیب '+s.enemy;document.getElementById('map').innerHTML=s.plots.map((p,i)=>'<button aria-label="خانه '+(i+1)+'" class="tile '+(i===s.selected?'sel ':'')+(i>=30?'enemy':'')+'" onclick="choose('+i+')">'+(i>=30?'🏴':p==='crop'?(s.growth[i]>=2?'🌽':'🌱'):p==='tower'?'🏰':'🌿')+'</button>').join('');document.getElementById('log').textContent=s.msg;save()}function choose(i){s.selected=i;s.msg=i>=30?'این قلمرو رقیب است. برای حمله نیرو آماده کنید.':'خانه '+(i+1)+' انتخاب شد.';render()}function act(a){if(s.hp<=0||s.enemy<=0){s.msg='بازی تمام شده؛ برای شروع دوباره دکمه شروع مجدد را بزنید.';return render()}let i=s.selected,p=s.plots[i];if(a==='plant'){if(i>=30||p!=='empty'||s.coins<10)s.msg='برای کاشت خانه خالی و ۱۰ سکه لازم است.';else{s.coins-=10;s.plots[i]='crop';s.growth[i]=0;s.msg='کشت انجام شد؛ دو روز تا برداشت.'}}if(a==='harvest'){if(p!=='crop'||s.growth[i]<2)s.msg='محصول هنوز آماده برداشت نیست.';else{s.plots[i]='empty';s.food+=25;s.coins+=20;s.msg='۲۵ غذا و ۲۰ سکه برداشت شد.'}}if(a==='tower'){if(i>=30||p!=='empty'||s.coins<40)s.msg='برج به خانه خالی و ۴۰ سکه نیاز دارد.';else{s.coins-=40;s.plots[i]='tower';s.msg='برج دفاعی ساخته شد.'}}if(a==='train'){if(s.coins<30||s.food<10)s.msg='۳۰ سکه و ۱۰ غذا برای آموزش لازم است.';else{s.coins-=30;s.food-=10;s.army+=2;s.msg='دو سرباز آموزش دیدند.'}}if(a==='attack'){if(s.army<3)s.msg='حداقل سه سرباز لازم است.';else{s.army-=3;let damage=15+Math.floor(Math.random()*16);s.enemy=Math.max(0,s.enemy-damage);s.coins+=15;s.msg='حمله موفق: '+damage+' آسیب به رقیب!'+(s.enemy===0?' پیروزی! 🏆':'')}}if(a==='next'){s.day++;s.growth=s.growth.map((g,j)=>s.plots[j]==='crop'?g+1:g);s.coins+=10;let towers=s.plots.filter(x=>x==='tower').length;let hit=Math.max(0,12+Math.floor(Math.random()*12)-towers*6);s.hp=Math.max(0,s.hp-hit);s.msg='درآمد روزانه: ۱۰ سکه؛ خسارت حمله رقیب: '+hit+(s.hp===0?'؛ مزرعه سقوط کرد!':'')}render()}function reset(){if(confirm('پیشرفت بازی پاک شود؟')){s=fresh();render()}}render();</script></html>
